databaseChangeLog:
  - changeSet:
      id: 002-create-servico
      author: muril
      changes:
        - createTable:
            tableName: servico
            columns:
              - column:
                  name: codigo
                  type: VARCHAR(50)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: descricao
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: horas_estimadas
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: valor_base
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false